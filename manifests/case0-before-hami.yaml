# CASE 0a — BEFORE HAMi — the scaling problem.
# A small GPU app. Each replica needs only a few GB, but the request is the classic
# "nvidia.com/gpu: 1", which with the stock NVIDIA device plugin = one WHOLE card.
#
#   kubectl apply -f manifests/case0-before-hami.yaml
#   kubectl -n gpu-demo scale deploy gpu-app --replicas=10
#   -> on a 4-GPU node: 4 Running, 6 Pending (Insufficient nvidia.com/gpu)
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-demo
  labels: { lab: hami }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-app
  namespace: gpu-demo
  labels: { lab: hami, app: gpu-app, case: case0 }
spec:
  replicas: 1
  selector:
    matchLabels: { app: gpu-app }
  template:
    metadata:
      labels: { app: gpu-app, lab: hami, case: case0 }
    spec:
      containers:
        - name: app
          image: nvidia/cuda:12.4.1-base-ubuntu22.04
          command: ["bash", "-c", "nvidia-smi -L; sleep infinity"]
          resources:
            limits:
              nvidia.com/gpu: 1        # = one whole physical GPU
